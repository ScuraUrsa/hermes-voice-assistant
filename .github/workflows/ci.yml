---
name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ${{ vars.CI_RUNS_ON || 'hermes' }}
    steps:
      # On the self-hosted runner the workspace persists between jobs, and the
      # test containers write root-owned files into it, which breaks checkout.
      - name: Reclaim workspace files left by containers
        if: runner.environment == 'self-hosted'
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox:1.36 chown -R "$(id -u):$(id -g)" /w
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run unit tests
        run: pytest tests/unit/

  integration-tests:
    runs-on: ${{ vars.CI_RUNS_ON || 'hermes' }}
    steps:
      # On the self-hosted runner the workspace persists between jobs, and the
      # test containers write root-owned files into it, which breaks checkout.
      - name: Reclaim workspace files left by containers
        if: runner.environment == 'self-hosted'
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox:1.36 chown -R "$(id -u):$(id -g)" /w
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start test containers
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to become healthy..."
          sleep 15
          docker compose -f docker-compose.test.yml ps
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run integration tests
        run: pytest tests/integration/
      - name: Tear down containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  quality-gates:
    runs-on: ${{ vars.CI_RUNS_ON || 'hermes' }}
    steps:
      # On the self-hosted runner the workspace persists between jobs, and the
      # test containers write root-owned files into it, which breaks checkout.
      - name: Reclaim workspace files left by containers
        if: runner.environment == 'self-hosted'
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox:1.36 chown -R "$(id -u):$(id -g)" /w
          fi
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: python3 -m pip install --user yamllint
      - name: Lint YAML files
        run: python3 -m yamllint --strict .
      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.test.yml config
